[build]
  command = "npm run build"
  publish = "dist"
  # Le Project ID Sanity est public (présent dans chaque URL d'image) → pas un secret
  environment = { SECRETS_SCAN_OMIT_KEYS = "SANITY_PROJECT_ID" }

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
